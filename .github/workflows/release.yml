name: Release Calcora APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build and test APK
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon testDebugUnitTest

      - name: Prepare APK
        run: |
          mkdir -p release
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release/Calcora-${TAG_NAME}-debug.apk"
          sha256sum release/Calcora-*-debug.apk > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
        run: |
          gh release create "$TAG_NAME" release/Calcora-*-debug.apk release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Calcora $TAG_NAME" \
            --notes "Calcora Android calculator. Includes the branded launcher icon and redesigned unit converter screen. Build and unit tests run in this workflow." \
            --target "$GITHUB_SHA"
